<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JungAgent Admin &middot; Authenticate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f14;
            --bg-elevated: #131722;
            --bg-card: rgba(19, 23, 34, 0.85);
            --border: rgba(148, 163, 184, 0.14);
            --border-focus: rgba(56, 189, 248, 0.5);
            --text: #C9CDD1;
            --text-bright: #F1F5F9;
            --text-dim: #64748B;
            --mono: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            --accent-lucid: #38BDF8;
            --accent-psyche: #C084FC;
            --accent-will: #F97316;
            --error: #f87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--mono);
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.05) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 48px 48px, 48px 48px;
            background-attachment: fixed;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .login-box {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .login-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-section img {
            width: 26px;
            height: 26px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .brand-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-bright);
        }

        .brand-name span {
            color: var(--accent-psyche);
            font-weight: 400;
        }

        .auth-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-lucid);
            border: 1px solid rgba(56, 189, 248, 0.25);
            background: rgba(56, 189, 248, 0.06);
            padding: 3px 8px;
            border-radius: 999px;
        }

        .pulse-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent-lucid);
            box-shadow: 0 0 6px var(--accent-lucid);
        }

        .login-prompt {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 22px;
            line-height: 18px;
        }

        .login-prompt span.cmd {
            color: var(--accent-lucid);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dim);
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            background: rgba(13, 17, 24, 0.85);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12.5px;
            color: var(--text-bright);
            font-family: var(--mono);
            transition: all 0.15s ease;
        }

        input[type="email"]::placeholder,
        input[type="password"]::placeholder {
            color: var(--text-dim);
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--border-focus);
            background: rgba(13, 17, 24, 1);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
        }

        .btn-signin {
            width: 100%;
            padding: 12px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: var(--text-bright);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            font-family: var(--mono);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-top: 10px;
        }

        .btn-signin:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.6);
            color: #ffffff;
        }

        .btn-signin:active {
            transform: translateY(1px);
        }

        .alert-box {
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 11.5px;
            line-height: 18px;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: var(--error);
        }

        .info-message {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: var(--accent-lucid);
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            color: var(--text-dim);
            font-size: 11px;
            border-top: 1px solid var(--border);
            padding-top: 18px;
        }

        .loading-indicator {
            display: none;
            text-align: center;
            margin-top: 14px;
            font-size: 11px;
            color: var(--accent-lucid);
        }

        .loading-indicator.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-header">
            <div class="brand-section">
                <img src="/static/jungagentdarkweb.png" alt="JungAgent" onerror="this.style.display='none'">
                <div class="brand-name">jung<span>agent</span></div>
            </div>
            <div class="auth-badge">
                <span class="pulse-dot"></span>
                <span>RBAC::SECURE</span>
            </div>
        </div>

        <div class="login-prompt">
            <span class="cmd">$ auth.login</span> --instance=production --verify
        </div>

        {% if error %}
        <div class="alert-box error-message">
            ! [ERR]: {{ error }}
        </div>
        {% endif %}

        {% if info %}
        <div class="alert-box info-message">
            i [INFO]: {{ info }}
        </div>
        {% endif %}

        <form method="POST" action="/admin/login" id="loginForm">
            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <div class="form-group">
                <label for="email">Operator Identity [Email]</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                    placeholder="operator@organization.com"
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">Session Token [Password]</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    placeholder="••••••••••••"
                >
            </div>

            <button type="submit" class="btn-signin">
                Authenticate Session &rarr;
            </button>

            <div class="loading-indicator" id="loading">
                $ verifying session token...
            </div>
        </form>

        <div class="footer-note">
            core/auth :: JungAgent Cockpit &middot; 2026
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function() {
            document.getElementById('loading').classList.add('active');
            document.querySelector('.btn-signin').disabled = true;
        });

        document.getElementById('email').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>
